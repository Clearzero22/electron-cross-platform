<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossPlatform</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 24px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      .badge {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #0ea5e9;
        color: #0f172a;
        font-weight: 600;
      }
      .toolbar-top {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .search-box {
        padding: 8px 14px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
        width: 200px;
        outline: none;
      }
      .search-box:focus {
        border-color: #0ea5e9;
      }
      .stats {
        font-size: 12px;
        color: #64748b;
      }
      .container {
        flex: 1;
        display: flex;
        padding: 24px;
        gap: 24px;
        overflow: hidden;
      }
      .sidebar {
        width: 260px;
        background: #1e293b;
        border-radius: 12px;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 12px;
      }
      .item {
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 4px;
        transition: background 0.15s;
      }
      .item:hover {
        background: #334155;
      }
      .item.active {
        background: #0ea5e9;
        color: #0f172a;
      }
      .item .title {
        font-weight: 500;
        font-size: 14px;
      }
      .item .date {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 2px;
      }
      .item .tags {
        display: flex;
        gap: 4px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(14, 165, 233, 0.2);
        color: #38bdf8;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
      }
      input,
      textarea {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 14px;
        outline: none;
      }
      input:focus,
      textarea:focus {
        border-color: #0ea5e9;
      }
      textarea {
        flex: 1;
        resize: none;
        font-family: inherit;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #0ea5e9;
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #38bdf8;
      }
      button.secondary {
        background: #334155;
        color: #e2e8f0;
      }
      button.secondary:hover {
        background: #475569;
      }
      button.danger {
        background: #ef4444;
        color: #fff;
      }
      button.danger:hover {
        background: #f87171;
      }
      .empty {
        text-align: center;
        color: #64748b;
        margin-top: 60px;
      }
      .meta {
        font-size: 12px;
        color: #64748b;
        padding: 8px 0;
      }
      .db-actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
      }
      .db-actions button {
        flex: 1;
        padding: 8px;
        font-size: 12px;
      }
      .tag-input {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .tag-input input {
        flex: 1;
        padding: 6px 10px;
        font-size: 12px;
      }
      .tag-input button {
        padding: 6px 12px;
        font-size: 12px;
      }

      /* 设置面板 */
      .settings-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 400px;
        height: 100vh;
        background: #1e293b;
        border-left: 1px solid #334155;
        padding: 24px;
        transition: right 0.3s ease;
        z-index: 100;
        overflow-y: auto;
      }
      .settings-panel.open {
        right: 0;
      }
      .settings-panel h2 {
        font-size: 18px;
        margin-bottom: 24px;
      }
      .setting-group {
        margin-bottom: 24px;
      }
      .setting-group h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 12px;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #334155;
      }
      .setting-row label {
        font-size: 14px;
      }
      .setting-row select,
      .setting-row input[type="number"] {
        padding: 6px 10px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 13px;
        outline: none;
      }
      .setting-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #0ea5e9;
      }
      .settings-close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        border: none;
        color: #64748b;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
      }
      .settings-close:hover {
        color: #e2e8f0;
      }

      /* 保存状态提示 */
      .save-status {
        font-size: 12px;
        color: #64748b;
        min-height: 16px;
      }
      .save-status.saved {
        color: #22c55e;
      }
      .save-status.saving {
        color: #eab308;
      }

      /* 错误提示 */
      .error-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 200;
        display: none;
      }
      .error-toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CrossPlatform</h1>
      <div class="toolbar-top">
        <input
          type="text"
          class="search-box"
          id="search"
          placeholder="Search..."
        />
        <span class="stats" id="stats"></span>
        <button
          class="secondary"
          id="btn-settings"
          style="padding: 8px 16px; font-size: 13px"
        >
          Settings
        </button>
        <span class="badge" id="platform">...</span>
      </div>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h2>Items</h2>
        <div id="list"></div>
        <div class="db-actions">
          <button class="secondary" id="btn-export">Export</button>
          <button class="secondary" id="btn-import">Import</button>
          <button class="secondary" id="btn-backup">Backup</button>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <input type="text" id="title" placeholder="Title..." />
          <button id="btn-new">New</button>
          <button id="btn-save" style="display: none">Save</button>
          <button id="btn-delete" class="danger" style="display: none">
            Delete
          </button>
        </div>
        <textarea id="content" placeholder="Content..."></textarea>
        <div class="tag-input" id="tag-input" style="display: none">
          <input type="text" id="tag-name" placeholder="Tag name..." />
          <button class="secondary" id="btn-add-tag">Add Tag</button>
        </div>
        <div class="save-status" id="save-status"></div>
        <div class="meta" id="meta"></div>
      </main>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settings-panel">
      <button class="settings-close" id="btn-close-settings">&times;</button>
      <h2>Settings</h2>

      <div class="setting-group">
        <h3>Appearance</h3>
        <div class="setting-row">
          <label>Theme</label>
          <select id="setting-theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="auto">Auto</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Font Size</label>
          <input
            type="number"
            id="setting-fontsize"
            min="10"
            max="24"
            value="14"
          />
        </div>
        <div class="setting-row">
          <label>Accent Color</label>
          <input
            type="color"
            id="setting-accent"
            value="#0ea5e9"
            style="width: 40px; height: 30px; border: none; background: none"
          />
        </div>
      </div>

      <div class="setting-group">
        <h3>Behavior</h3>
        <div class="setting-row">
          <label>Auto Save (seconds)</label>
          <input
            type="number"
            id="setting-autosave"
            min="0"
            max="300"
            value="30"
          />
        </div>
        <div class="setting-row">
          <label>Check Updates</label>
          <input type="checkbox" id="setting-checkupdates" checked />
        </div>
        <div class="setting-row">
          <label>Minimize to Tray</label>
          <input type="checkbox" id="setting-tray" checked />
        </div>
      </div>

      <div class="setting-group">
        <h3>Window</h3>
        <div class="setting-row">
          <label>Remember Position</label>
          <input type="checkbox" id="setting-rememberpos" checked />
        </div>
      </div>
    </div>

    <!-- 错误提示 -->
    <div class="error-toast" id="error-toast"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
